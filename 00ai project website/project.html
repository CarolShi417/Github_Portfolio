<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aaaaaa</title>
    <style>
      :root {
        --paper: #f9f8f6;
        --ink: #232222;
        --green: #d9f0d4;
        --green-deep: #c7e9c1;
        --line: rgb(35 34 34 / 18%);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, Helvetica, sans-serif;
        font-weight: 400;
      }
      body.menu-open { overflow: hidden; }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; }

      .site-header {
        position: fixed;
        top: 0;
        left: 50%;
        z-index: 20;
        display: grid;
        grid-template-columns: minmax(90px, 1fr) auto minmax(90px, 1fr);
        align-items: start;
        width: min(100%, 1440px);
        padding: 28px 30px 0;
        isolation: isolate;
        mix-blend-mode: multiply;
        transform: translateX(-50%);
      }
      .site-header::before {
        position: absolute;
        top: 6px;
        right: 10px;
        left: 10px;
        z-index: -1;
        height: 44px;
        border-radius: 5px;
        background: rgba(251, 251, 250, 0.8);
        box-shadow: 0 12px 34px rgba(25, 35, 43, 0.08);
        backdrop-filter: blur(18px);
        content: "";
        opacity: 0;
        transition: opacity 180ms ease;
      }
      .site-header.has-backdrop { mix-blend-mode: normal; }
      .site-header.has-backdrop::before { opacity: 1; }
      .nav-primary { display: flex; gap: 18px; justify-content: center; }
      .nav-about { justify-self: end; }
      .nav-link {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 0;
        border: 0;
        background: transparent;
        color: rgb(35 34 34 / 74%);
        font-size: 12px;
        font-weight: 800;
        line-height: 1;
        text-decoration: none;
        cursor: pointer;
        transition: color 160ms ease, transform 160ms ease;
      }
      .nav-link:hover,
      .nav-link:focus-visible,
      .nav-link.is-active { color: var(--ink); transform: translateY(-1px); }

      .hero {
        /* 鍘熺珯棣栧睆绾︿负褰撳墠瑙嗗彛楂樺害鍑忓幓 140px锛岃€岄潪鍥哄畾姣斾緥鎴栧浐瀹氭渶澶у€笺€?*/
        height: calc(100svh - 140px);
        min-height: 580px;
        background: var(--green);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        column-gap: 20px;
        padding-right: 30px;
        padding-left: 30px;
      }
      .basics { min-height: 568px; padding-top: 0; }
      .title { grid-column: 1 / 10; margin: 0 0 51px; font-size: clamp(90px, 5.2vw, 106px); font-weight: 400; line-height: 1; letter-spacing: -.055em; }
      .lead { grid-column: 1 / 10; margin: 0 0 121px; font-size: 30px; line-height: 34px; letter-spacing: -.035em; }
      .metadata {
        grid-column: 5 / -1;
        display: flex;
        align-self: start;
        margin: 0 0 60px;
        padding: 0;
        font-size: 14px;
        line-height: 20px;
      }
      .metadata div { min-width: 0; flex: 1 1 0; }
      .metadata dt { display: block; height: 26px; border-bottom: 1px solid var(--ink); font-weight: 400; }
      .metadata dd { margin: 10px 0 0; text-align: left; text-transform: uppercase; }

      .copy { margin-bottom: 45px; }
      /* 鍗曞浘鍚庢帴姝ｆ枃鏃讹紝鍘熺珯淇濈暀 90px 鐨勭嫭绔嬪懠鍚哥┖闂淬€?*/
      .copy--after-media { margin-top: 90px; }
      .copy__body { grid-column: 8 / -1; }
      .copy p { margin: 0 0 22px; font-size: 17px; line-height: 22px; }
      .copy p:last-child { margin-bottom: 0; }
      .copy .button-link {
        display: inline-block;
        margin-top: 8px;
        padding-bottom: 3px;
        border-bottom: 1px solid currentColor;
        font-size: 12px;
        letter-spacing: .025em;
      }

      .media {
        position: relative;
        margin-top: 90px;
        min-height: 531px;
      }
      .media__block {
        grid-column: 5 / -1;
        min-height: 531px;
        background: var(--green);
      }
      .media__block--short { min-height: 406px; }
      .media__block--tall { min-height: 797px; }
      .media__label {
        position: absolute;
        top: 14px;
        left: 14px;
        font-size: 11px;
        line-height: 1.25;
        letter-spacing: .04em;
      }
      .media__caption {
        position: absolute;
        right: 14px;
        bottom: 13px;
        left: 14px;
        font-size: 11px;
        line-height: 1.25;
      }
      .media--double { min-height: 594px; }
      .media--double .media__block {
        grid-column: 5 / 9;
        min-height: 594px;
      }
      .media--double .media__block + .media__block { grid-column: 9 / -1; background: var(--green-deep); }

      .statement { margin-top: 88px; margin-bottom: 0; }
      .statement .copy__body { grid-column: 5 / -1; }
      .statement h2 { margin: 0 0 34px; font-size: 12px; font-weight: 400; line-height: 22px; letter-spacing: .025em; text-transform: uppercase; }
      .statement p { max-width: 49rem; }
      .credits { margin-top: 94px; }
      .credits .copy__body { grid-column: 5 / -1; }
      .credits p { margin-bottom: 16px; font-size: 12px; line-height: 17px; }

      .project-nav {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 220px;
        padding: 0 30px;
      }
      .project-nav a { position: relative; display: block; min-height: 164px; border-top: 1px solid var(--line); padding-top: 18px; font-size: 12px; }
      .project-nav a:last-child { color: rgb(35 34 34 / 45%); text-align: right; }
      .project-nav strong { display: block; margin-top: 25px; font-size: 16px; font-weight: 400; }
      .project-nav__thumb { position: absolute; top: 15px; right: 0; width: 31%; height: 104px; background: var(--green); }
      .project-nav a:last-child .project-nav__thumb { left: 0; right: auto; background: var(--green-deep); }
      footer { display: flex; justify-content: space-between; gap: 20px; padding: 0 30px 20px; font-size: 12px; line-height: 20px; }

      .reveal { opacity: 0; transform: translateY(22px); transition: opacity 700ms ease, transform 700ms cubic-bezier(.2,.7,.2,1); }
      .reveal.is-visible { opacity: 1; transform: translateY(0); }

      @media (max-width: 767px) {
        .site-header { grid-template-columns: 1fr auto; gap: 14px; padding: 16px 10px 0; }
        .nav-primary { order: 3; grid-column: 1 / -1; justify-content: flex-start; gap: 13px; overflow-x: auto; scrollbar-width: none; }
        .nav-primary::-webkit-scrollbar { display: none; }
        .hero { height: calc(100svh - 140px); min-height: 0; }
        .grid { grid-template-columns: repeat(18, minmax(0, 1fr)); column-gap: 10px; padding: 0 10px; }
        .basics { min-height: 397px; }
        .title { grid-column: 1 / -1; margin-bottom: 21px; font-size: 40px; line-height: 40px; letter-spacing: -.045em; }
        .lead { grid-column: 1 / -1; margin-bottom: 35px; font-size: 15px; line-height: 18px; letter-spacing: -.02em; }
        .metadata { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 15px 10px; margin: 0 0 25px; font-size: 10px; line-height: 13px; }
        .metadata dt { height: 19px; }
        .metadata dd { margin-top: 7px; }
        .copy { margin-bottom: 35px; }
        .copy--after-media { margin-top: 55px; }
        .copy__body { grid-column: 7 / -1; }
        .copy p { margin-bottom: 15px; font-size: 12px; line-height: 15px; }
        .media { min-height: 237px; margin-top: 55px; }
        .media__block, .media__block--short, .media__block--tall { grid-column: 1 / -1; min-height: 237px; }
        .media--double { min-height: 259px; }
        .media--double .media__block { grid-column: 1 / 10; min-height: 259px; }
        .media--double .media__block + .media__block { grid-column: 10 / -1; }
        .statement { margin-top: 62px; }
        .statement .copy__body, .credits .copy__body { grid-column: 1 / -1; }
        .project-nav { gap: 10px; margin-top: 100px; padding: 0 10px; }
        .project-nav a { min-height: 112px; padding-top: 10px; font-size: 10px; }
        .project-nav strong { font-size: 12px; }
        .project-nav__thumb { top: 27px; width: 42%; height: 72px; }
        footer { flex-direction: column; padding: 0 10px 14px; font-size: 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        .reveal { opacity: 1; transform: none; transition: none; }
      }
    </style>
