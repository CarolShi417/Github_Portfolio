<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content Marketing</title>
    <style>
      body {
        margin: 0;
        background: #fbfbfa;
        color: #232222;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>
  </head>
  <body>
    <script>
      /* 兼容旧链接：保持 /figma-home/content-marketing.html 地址不变。 */
      (async () => {
        const target = new URL("../02%20content-marketing/content-marketing.html", window.location.href);
        target.search = window.location.search;

        try {
          const response = await fetch(target.href, { cache: "no-store" });
          if (!response.ok) throw new Error(`Unable to load content marketing page: ${response.status}`);

          const page = await response.text();
          const pageWithBase = page.replace(
            /<head(\s[^>]*)?>/i,
            "$&<base href=\"../02%20content-marketing/\" />"
          );

          document.open();
          document.write(pageWithBase);
          document.close();
        } catch (error) {
          document.body.innerHTML = "<p style=\"padding:24px\">Content Marketing could not be loaded. Please refresh the page.</p>";
          console.error(error);
        }
      })();
    </script>
  </body>
</html>
